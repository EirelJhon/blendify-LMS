<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blendify LMS | Redirecting</title>
  <script>
    (function () {
      var path = window.location.pathname.toLowerCase();
      if (path.includes('create-course') || path.includes('studio')) {
        window.location.replace('./create-course.html');
      } else if (path.includes('login')) {
        window.location.replace('./login.html');
      } else {
        window.location.replace('./index.html');
      }
    })();
  </script>
</head>

<body style="background:#0b0f19;color:#94a3b8;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
  <p>Loading Blendify LMS...</p>
</body>

</html>
