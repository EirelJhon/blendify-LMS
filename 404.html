<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blendify LMS | Redirecting</title>
  <script>
    (function () {
      var pathname = window.location.pathname;
      var search = window.location.search || '';
      var hash = window.location.hash || '';
      var pathParts = pathname.split('/').filter(Boolean);

      // Dynamically detect GitHub Pages repository subpath (e.g. username.github.io/repo-name/...)
      var base = '/';
      if (window.location.hostname.endsWith('github.io') && pathParts.length > 0) {
        base = '/' + pathParts[0] + '/';
      }

      var lower = pathname.toLowerCase();
      var target = 'index.html';
      if (lower.includes('create-course') || lower.includes('studio')) {
        target = 'create-course.html';
      } else if (lower.includes('login')) {
        target = 'login.html';
      }

      window.location.replace(base + target + search + hash);
    })();
  </script>
</head>

<body style="background:#0b0f19;color:#94a3b8;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
  <p>Loading Blendify LMS...</p>
</body>

</html>
